version: '3.8'

# ======================================================================
# 🔴 内存：本文件的每一项内存参数都是事故后加的，不要删
# ----------------------------------------------------------------------
# 2026-09-21 这台服务器（与 pm-system 共用）发生过一次 OOM 雪崩：
# 内核 OOM killer 先杀本项目的 java 与 mysqld，最后把 dockerd 自己
# （RSS 1 GB）也杀了两次，结果 8 个容器里 7 个停摆。
#
# 根因是**结构性超配**。加固前实测的容器内存：
#     cloudland-backend   318.3 MiB   ← JVM 未设堆上限
#     cloudland-mysql     351.8 MiB   ← InnoDB 缓冲池 128M + performance_schema
#     pm-backend          170.1 MiB   ← 已加固，对照
#     pm-mysql            126.8 MiB   ← 已加固，对照
# 同样的两个服务，加固与不加固差 **373 MiB**。
#
# 下面两处（backend 的 JAVA_TOOL_OPTIONS、mysql 的 command）与 pm-system
# 用的是同一套参数，理由是两台栈是同构的 Spring Boot + MySQL + Redis。
#
# ⚠️ 这些不是"可选优化"。删掉它们，OOM 会再来一次。
#
# ======================================================================
# 🔴 容器内存上限（mem_limit）：爆炸半径控制
# ----------------------------------------------------------------------
# 上面的参数管"少用内存"；mem_limit 管的是**失控时的边界**。
#
# 没有它时，任何容器都能吃满 1.87 GiB 宿主机内存 —— 2026-09-21 的 OOM
# 雪崩中，内核把 dockerd 自己杀了两次，8 个容器里 7 个停摆、整机停摆约 30 分钟，
# 而 Docker 因 hasBeenManuallyStopped=true 不会自动拉起它们。
#
# 设上限后：OOM 被关在容器的 cgroup 里，**只杀它自己**，
# dockerd 与其余容器不受影响。事故规模从"整机停摆"降为"一个容器重启一次"。
#
# ⚠️ 各限额之和大于物理内存 —— 这是刻意的：mem_limit 是"单个容器的失控边界"，
#    不是"总量配额"。要限制总量只能加内存或减负载。
# ⚠️ 只设 mem_limit 时，memswap_limit 默认取其 2 倍（允许等量 swap）——
#    刻意保留这个默认：宁可慢，也不要被直接杀掉。
# ======================================================================

# ⚠️ 应用镜像按 IMAGE_TAG 取 tag（值 = commit SHA），不再是 latest。
#    正常部署走 scripts/deploy.sh（它负责计算并导出 IMAGE_TAG）。
#    手工排查时也必须带上，否则本文件会直接报错：
#        cd /root/cloudland
#        IMAGE_TAG=$(git rev-parse HEAD) docker compose ps
#    ⚠️ 不要在本文件同级 .env 里定义 IMAGE_TAG（见 .env.example 的警告）。

services:
  backend:
    # 方案 B：镜像由 Gitee 云端构建并推送到阿里云 ACR
    # （见 .workflow/流水线-*.yml 里的 build@docker 步骤）
    # 服务器只 pull + up，不再本地编译 Maven —— 部署不再产生内存峰值。
    # ⚠️ 地址里的 t1longlive 是 ACR 命名空间，与 Gitee 个人空间地址一致
    #
    # 用 `:?` 而非 `:-` 是刻意的：变量缺失时直接报错退出，
    # 避免"静默拉取 latest"这种查不出来的错。
    # （报错文案保持纯 ASCII，避免服务器 locale 不完整时输出乱码。）
    image: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com/t1longlive/cloudland-backend:${IMAGE_TAG:?IMAGE_TAG is not set - deploy via scripts/deploy.sh}
    container_name: cloudland-backend
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 512m
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cloudland?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILE_STORAGE_ROOT: /cloudland-files
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CODE_MASTER_ENABLED: ${CODE_MASTER_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL}
      TZ: Asia/Shanghai
      # ================================================================
      # 🔴 JVM 堆上限 —— 2026-09-21 OOM 事故的直接对策
      # ================================================================
      # 不加这一行时，JVM 默认取宿主内存的 1/4。对一台 1.87 GiB 的机器，
      # 那是 ~470 MiB/进程 —— 两套栈的后端加起来近 1 GB 的潜在堆。
      # 实测：加固前本容器 318.3 MiB，同构的 pm-backend 加固后只有 170.1 MiB。
      #
      # 为什么用 JAVA_TOOL_OPTIONS 而不是 JAVA_OPTS：
      #   它是 JVM 自己识别的环境变量，不依赖 shell 展开 ——
      #   Dockerfile 里无论用 exec 还是 shell 形式的 ENTRYPOINT/CMD 都生效。
      #
      # -XX:+UseSerialGC：单线程 GC，不额外起 GC 工作线程（省内存与 CPU）
      # -Xss512k：线程栈从默认 1M 降到 512k
      #
      # -XX:+ExitOnOutOfMemoryError：OOM 时**让进程直接退出**，而不是抛个异常继续跑。
      #   默认行为是「抛 OutOfMemoryError 但进程不死」→ 应用半死不活：
      #   容器状态仍是 Up，健康检查照常放行，可某些功能已在报 500 —— 比直接挂更难查。
      #   加上它之后：进程退出 → 容器 Exited → restart 策略拉起 → 健康检查发现
      #   → 重启次数上升（可见）。即 fail-fast 换可观测性。
      #
      # 🔴 已实测本镜像的 JVM 支持该参数（Java 8u342，而它自 JDK 8u92 起提供）：
      #   不支持的参数会让 JVM 直接拒绝启动，对照测试会报 `Unrecognized VM option`。
      JAVA_TOOL_OPTIONS: "-Xmx320m -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError"
    volumes:
      - cloudland-files:/cloudland-files
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  frontend:
    # 同上：镜像来自云端构建产物；tag 由 IMAGE_TAG 决定（见文件头说明）
    image: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com/t1longlive/cloudland-frontend:${IMAGE_TAG:?IMAGE_TAG is not set - deploy via scripts/deploy.sh}
    container_name: cloudland-frontend
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 64m
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: docker.1panel.live/library/mysql:8.0
    container_name: cloudland-mysql
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: cloudland
    # ================================================================
    # 🔴 缩小 MySQL 的内存占用
    # ================================================================
    # 实测本容器 351.8 MiB，大头是：
    #   · InnoDB 缓冲池：默认 128 MiB
    #   · performance_schema：MySQL 8 默认开启，额外吃 100~200 MiB
    # 同构的 pm-mysql 加上这两个参数后降到 126.8 MiB —— **省了 225 MiB**。
    #
    # ⚠️ 两个都是**启动参数**，改了必须重建容器才生效（不是热改）。
    #    它们只影响内存分配，**不触碰任何数据**。
    # ⚠️ 刻意不加 --skip-name-resolve：会让基于主机名的授权失效，
    #    属于"省一点内存但可能连不上库"的陷阱，不值得。
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    # 生产环境不对外暴露端口：backend 通过 compose 内部网络 mysql:3306 访问即可。
    # 如需本地用 GUI 客户端调试，临时改用：
    #   ports:
    #     - "127.0.0.1:3306:3306"   # 仅绑定回环，杜绝公网暴露
    volumes:
      - mysql-data:/var/lib/mysql
      - ./cloudland.sql:/docker-entrypoint-initdb.d/cloudland.sql
    restart: unless-stopped

  redis:
    image: docker.1panel.live/library/redis:7-alpine
    container_name: cloudland-redis
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 128m
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  cloudland-files:
  mysql-data:
  redis-data:
