version: '3.8'

services:
  backend:
    build: .
    container_name: cloudland-backend
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cloudland?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILE_STORAGE_ROOT: /cloudland-files
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CODE_MASTER_ENABLED: ${CODE_MASTER_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL}
      TZ: Asia/Shanghai
    volumes:
      - cloudland-files:/cloudland-files
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  frontend:
    build: ./vue
    container_name: cloudland-frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: docker.1panel.live/library/mysql:8.0
    container_name: cloudland-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: cloudland
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./cloudland.sql:/docker-entrypoint-initdb.d/cloudland.sql
    restart: unless-stopped

  redis:
    image: docker.1panel.live/library/redis:7-alpine
    container_name: cloudland-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  cloudland-files:
  mysql-data:
  redis-data:
