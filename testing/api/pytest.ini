[pytest]
testpaths = .
addopts = -ra --strict-markers
norecursedirs = allure-results __pycache__ .pytest_cache reports

; 分层调度（见 .github/workflows/ci.yml 的 API job）：
;   PR           -> -m "smoke or p0"   27 条核心链路，分钟级反馈
;   push main    -> 全量 34 条
;   夜间 cron    -> 全量 34 条 + E2E 全量
;   schedule 6h  -> 只跑线上只读冒烟（不走 pytest）
; 打标位置：各 test_*.py 顶部的 pytestmark 模块级标记。
markers =
    smoke: 冒烟用例，PR 必跑
    regression: 全量回归，夜间跑
    p0: 核心链路
    p1: 次要链路
    infra: 依赖网络/环境，允许重试
    flaky: 已知不稳定，单独统计
