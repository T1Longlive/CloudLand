name: CI

# ======================================================================
# Cloudland 质量门禁
# ----------------------------------------------------------------------
# 分层策略（为什么不是"一个 job 跑所有测试"）：
#   1. unit  —— JUnit 纯单元测试，几十秒出结果，不依赖数据库。
#               任何 PR 都跑，红得最快，定位最准。
#   2. api   —— pytest 接口测试，需要 MySQL + Redis + 真实后端进程。
#               只跑 smoke + p0（核心链路），把反馈控制在分钟级。
#   3. e2e   —— Playwright 端到端，最慢的一层（装浏览器 + 起前端 dev server）。
#               它不替代接口测试，只回答一个接口层答不了的问题：
#               "用户真的点得通吗"。
#   4. gate  —— 汇总作业，只做"一票否决"。
#               GitHub 分支保护只能勾选具体 job 作为必需检查，
#               有一个稳定的 gate 名字，就不用每次加 job 都去改分支保护配置。
#   5. smoke —— 线上只读巡检，与本文件的门禁解耦（continue-on-error）。
#
# 为什么 PR 不跑全量：
#   全量靠 push main 与定时任务兜。PR 阶段要的是"5 分钟内知道能不能合"，
#   跑 30 分钟的流水线只会让人绕过它。
#
# 与 build-deploy.yml 的关系（这是门禁闭环的关键）：
#   build-deploy.yml 用 workflow_run 监听本工作流。
#   CI 不成功 → 部署作业不会被创建 → 镜像不会推、服务器不会动。
#   ⚠️ 曾踩过的坑：ci.yml 被删过一次，workflow_run 找不到 "CI"，
#      导致部署"永久卡在等待"且不报错。改这个文件名等于改部署触发条件。
# ======================================================================

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.workbuddy/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # 夜间全量（UTC 18 = 北京 02:00）：没人 push 的日子也兜底跑一遍 110 条
    - cron: '0 18 * * *'
    # 每 6 小时线上只读巡检：只跑 smoke job，重型 job 条件跳过
    - cron: '0 */6 * * *'

# 同一分支连续 push 时取消上一轮：省额度，也避免旧结果覆盖新结论
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与生产一致的 JDK：项目 target 是 1.8，用 17 编译能过但会和线上行为有偏差
  JAVA_VERSION: '8'
  PYTHON_VERSION: '3.11'

jobs:
  # ====================================================================
  # 1. 单元测试：不依赖任何外部服务，最快反馈
  # ====================================================================
  unit:
    name: 单元测试 (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 6 小时巡检只跑 smoke job，单元/接口/门禁跳过
    if: github.event_name != 'schedule' || github.event.schedule == '0 18 * * *'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 运行单元测试
        # surefire 失败会让这一步非 0 退出，job 直接红 —— 这就是门禁本身。
        # 不需要额外脚本判断"测试是否失败"，Maven 已经做完了。
        run: mvn -B -ntp test

      - name: 上传测试报告（失败也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: 上传 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: 在 PR 里展示失败摘要
        if: failure()
        run: |
          echo "### 单元测试失败" >> $GITHUB_STEP_SUMMARY
          grep -h "Tests run" target/surefire-reports/*.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -h -A 5 "FAILURE" target/surefire-reports/*.txt 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ====================================================================
  # 2. 接口测试：真实 MySQL + Redis + 真实后端进程
  # ====================================================================
  api:
    name: 接口测试 (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    if: github.event_name != 'schedule' || github.event.schedule == '0 18 * * *'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: cloudland
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/cloudland?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: root
      DB_PASSWORD: '123456'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '123456'
      # CI 里没有 D 盘，文件存储根目录必须换到 runner 的临时目录
      FILE_STORAGE_ROOT: /tmp/cloudland-files
      # 万能验证码：只允许在测试环境开启，生产必须关掉
      CODE_MASTER_ENABLED: 'true'
      TEST_API_BASE_URL: http://127.0.0.1:9090/api
      TEST_MASTER_CODE: '000000'

    steps:
      - uses: actions/checkout@v4

      - name: 启动 Redis（带密码）
        # 为什么不写在 services 里：services 的 options 会被原样拼进 docker create，
        # 而 --requirepass 是 redis-server 的参数、不是 docker 的参数，
        # docker create 会以 exit 125 直接拒绝（unknown flag）——
        # 2026-11-17 首跑就死在 "Initialize containers"，api / e2e 两个作业同时红。
        # services 又不支持指定 command，所以这里显式跑一个容器并自己等健康。
        # 密码必须开：application.yml 的 redis.password 默认 123456，
        # 起一个无密码的 Redis 会让 Lettuce 认证失败。
        run: |
          set -euo pipefail
          docker run -d --name ci-redis -p 6379:6379 redis:7 \
            redis-server --requirepass 123456
          for i in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a 123456 ping 2>/dev/null | grep -q PONG; then
              echo "Redis 已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "Redis 30s 内未就绪，日志如下："
          docker logs ci-redis
          exit 1

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 初始化数据库结构
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -p123456 cloudland < cloudland.sql
          mysql -N -h 127.0.0.1 -uroot -p123456 \
            -e "SELECT CONCAT('表数量：', COUNT(*)) FROM information_schema.tables WHERE table_schema='cloudland'"

      - name: 注入测试种子账号
        # 固定账号是接口测试的前置条件。把它做成可执行 SQL，而不是"谁手工建过"。
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -p123456 cloudland \
            < testing/api/data/seed/seed_test_accounts.sql
          mysql -h 127.0.0.1 -uroot -p123456 cloudland \
            -e "SELECT phone, power, status FROM user WHERE phone LIKE '199%' ORDER BY phone;"

      - name: 构建后端 jar
        # 单元测试已在 unit 作业跑过，这里跳过以省时间（-DskipTests 仍会编译测试代码）
        run: mvn -B -ntp -DskipTests package

      - name: 生成一次性支付宝密钥（pay 用例只做本地签名，不联网）
        # 沙箱真实密钥不进 CI；pageExecute 仅本地构造表单，一次性 RSA 密钥对足够。
        # SDK 要求 DER 的 base64（无 PEM 头），私钥需 PKCS8。
        run: |
          set -euo pipefail
          openssl genrsa -out /tmp/alipay_private.pem 2048
          openssl pkcs8 -topk8 -inform PEM -in /tmp/alipay_private.pem -outform DER -nocrypt \
            | base64 -w0 > /tmp/alipay_private.b64
          openssl rsa -in /tmp/alipay_private.pem -pubout -outform DER \
            | base64 -w0 > /tmp/alipay_public.b64
          {
            echo "ALIPAY_APP_ID=2021000000000000"
            echo "ALIPAY_PRIVATE_KEY=$(cat /tmp/alipay_private.b64)"
            echo "ALIPAY_PUBLIC_KEY=$(cat /tmp/alipay_public.b64)"
          } >> "$GITHUB_ENV"

      - name: 启动后端并等待就绪
        run: |
          set -euo pipefail
          mkdir -p /tmp/cloudland-files
          nohup java -jar target/Cloudland-*.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9090/api/actuator/health > /dev/null; then
              echo "后端已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "后端 60s 内未就绪，日志如下："
          tail -100 /tmp/backend.log
          exit 1

      - name: 安装 Python 依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r testing/api/requirements.txt

      - name: 选择用例集合（PR 子集 / 其余全量）
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'markers=-m "smoke or p0"' >> "$GITHUB_OUTPUT"
          else
            echo 'markers=' >> "$GITHUB_OUTPUT"
          fi

      - name: 运行接口测试
        working-directory: testing/api
        run: python -m pytest ${{ steps.select.outputs.markers }} --alluredir=allure-results

      - name: 后端日志（失败时）
        if: failure()
        run: tail -200 /tmp/backend.log

      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: testing/api/allure-results/
          retention-days: 7

  # ====================================================================
  # 3. 端到端测试：真实浏览器 + 真实前端 + 真实后端
  #    这一层慢（装浏览器 + 起前端），但它是唯一能证明"用户点得通"的证据。
  #    接口层再全，也证明不了按钮点下去会不会 404。
  # ====================================================================
  e2e:
    name: 端到端测试 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    if: github.event_name != 'schedule' || github.event.schedule == '0 18 * * *'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: cloudland
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/cloudland?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: root
      DB_PASSWORD: '123456'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '123456'
      FILE_STORAGE_ROOT: /tmp/cloudland-files
      # E2E 登录必须过验证码这一关，用万能码把"收邮件"从链路里摘掉
      CODE_MASTER_ENABLED: 'true'
      CODE_MASTER_VALUE: '000000'
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_API_BASE_URL: http://127.0.0.1:9090/api
      E2E_MASTER_CODE: '000000'

    steps:
      - uses: actions/checkout@v4

      - name: 启动 Redis（带密码）
        # 为什么不写在 services 里：services 的 options 会被原样拼进 docker create，
        # 而 --requirepass 是 redis-server 的参数、不是 docker 的参数，
        # docker create 会以 exit 125 直接拒绝（unknown flag）——
        # 2026-11-17 首跑就死在 "Initialize containers"，api / e2e 两个作业同时红。
        # services 又不支持指定 command，所以这里显式跑一个容器并自己等健康。
        # 密码必须开：application.yml 的 redis.password 默认 123456，
        # 起一个无密码的 Redis 会让 Lettuce 认证失败。
        run: |
          set -euo pipefail
          docker run -d --name ci-redis -p 6379:6379 redis:7 \
            redis-server --requirepass 123456
          for i in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a 123456 ping 2>/dev/null | grep -q PONG; then
              echo "Redis 已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "Redis 30s 内未就绪，日志如下："
          docker logs ci-redis
          exit 1

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 两个 node 工程各有一把锁：前端（被测系统）和 testing/e2e（测试本身）
          cache: 'npm'
          cache-dependency-path: |
            vue/package-lock.json
            testing/e2e/package-lock.json

      - name: 初始化数据库结构
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -p123456 cloudland < cloudland.sql

      - name: 注入测试种子账号
        # E2E 的登录用例直接依赖这三个账号，和接口层用的是同一份 SQL
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -p123456 cloudland \
            < testing/api/data/seed/seed_test_accounts.sql
          mysql -N -h 127.0.0.1 -uroot -p123456 cloudland \
            -e "SELECT CONCAT('seed 账号数：', COUNT(*)) FROM user WHERE phone LIKE '199%'"

      - name: 构建后端 jar
        run: mvn -B -ntp -DskipTests package

      - name: 启动后端并等待就绪
        run: |
          set -euo pipefail
          mkdir -p /tmp/cloudland-files
          nohup java -jar target/Cloudland-*.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9090/api/actuator/health > /dev/null; then
              echo "后端已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "后端 60s 内未就绪，日志如下："
          tail -100 /tmp/backend.log
          exit 1

      - name: 安装前端依赖
        working-directory: vue
        run: npm ci

      - name: 安装 E2E 依赖
        working-directory: testing/e2e
        run: npm ci

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ hashFiles('testing/e2e/package-lock.json') }}

      - name: 安装 WebKit（含系统依赖）
        working-directory: testing/e2e
        run: npx playwright install --with-deps webkit

      - name: 运行 E2E
        # 前端由 Playwright 的 webServer 拉起（npm --prefix ../../vue run serve），
        # 所以这里不需要额外起前端。CI 下 reuseExistingServer=false，必定自己起一份干净的。
        working-directory: testing/e2e
        run: npx playwright test

      - name: 后端日志（失败时）
        if: failure()
        run: tail -200 /tmp/backend.log

      - name: 上传 Playwright 报告与失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            testing/e2e/playwright-report/
            testing/e2e/test-results/
          retention-days: 7

  # ====================================================================
  # 4. 汇总门禁：分支保护只需要盯这一个 job
  # ====================================================================
  gate:
    name: 质量门禁（汇总）
    runs-on: ubuntu-latest
    needs: [unit, api, e2e]
    if: always() && (github.event_name != 'schedule' || github.event.schedule == '0 18 * * *')
    steps:
      - name: 判定
        run: |
          echo "unit: ${{ needs.unit.result }}"
          echo "api : ${{ needs.api.result }}"
          echo "e2e : ${{ needs.e2e.result }}"
          if [ "${{ needs.unit.result }}" != "success" ] \
             || [ "${{ needs.api.result }}" != "success" ] \
             || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::门禁未通过，禁止合并 / 禁止部署"
            exit 1
          fi
          echo "门禁通过"

  # ====================================================================
  # 5. 线上只读巡检：push 门禁随跑 + 每 6 小时 cron 单独跑
  #    目标主机取部署 secret（服务器已迁腾讯云），不硬编码旧 IP。
  #    continue-on-error：线上自身故障只告警，不能挡住"发修复版本"（防死锁）。
  # ====================================================================
  smoke:
    name: 线上只读巡检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: github.event_name != 'pull_request'
    env:
      PROD_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: 四步只读断言（不写库、不造数、不部署）
        run: |
          set -euo pipefail
          if [ -z "$PROD_HOST" ]; then
            echo "SERVER_HOST 未配置，跳过巡检"
            exit 0
          fi
          base="http://$PROD_HOST"
          curl -sf --max-time 15 "$base/" -o /dev/null
          curl -sf --max-time 15 "$base/api/actuator/health" | grep -q '"UP"'
          curl -sf --max-time 15 -X POST "$base/api/land/page?pageNum=1&pageSize=5" \
            --data-urlencode 'land={}' \
            | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b["code"]==10004 and b["data"]["records"], b'
          curl -sf --max-time 15 -X POST "$base/api/product/page?pageNum=1&pageSize=5" \
            --data-urlencode 'product={}' \
            | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b["code"]==10004 and b["data"]["records"], b'
          echo "线上巡检通过"
