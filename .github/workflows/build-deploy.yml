name: build-and-deploy

# ======================================================================
# Cloudland 交付流水线（GitHub Actions）
# ----------------------------------------------------------------------
# 为什么从 Gitee Go 迁过来（2026-09-24）：
#   · Gitee Go 个人版额度耗尽后，Cloudland 自 2026-09-21 起再没成功部署过；
#   · pm-system 已于 09-23 迁到 GitHub Actions 并实证跑通（09-24 16:51 部署成功）。
#     本文件与它的 `.github/workflows/build-deploy.yml` 同构，便于对照维护。
#
# 与 pm-system 版的差异（不是抄错，是项目本身不同）：
#   1. **Trivy 这里是「只报告不阻断」**（exit-code 0），而 pm-system 已转硬门禁。
#      原因：Cloudland 是 Java 8 + Spring Boot 2.x + node:16-alpine 老栈，
#      老基础镜像的 CVE 不是升个版本号就能清零的。pm-system 能转硬门禁，
#      是因为先把 Spring Boot 3.2.5 → 4.1.1、并重新转存了基础镜像，基线归零后才敢阻断。
#      直接上硬门禁只会天天红，红到没人看等于没装。
#      ⇒ 转硬门禁的前置条件：先看清基线、能修的修掉、实在不能修的写进 .trivyignore（带理由）。
#   2. **没有单独的测试步骤**：后端 Dockerfile 里 `mvn clean package` 会跑单元测试
#      （JwtUtilsTest / CodeTest / ResultTest，均无 Spring 上下文、不依赖 MySQL/Redis），
#      测试失败 → 构建层失败 → 不会推镜像、不会部署。门禁已内建在构建里。
#      前端/API 的重型测试（pytest 34 + Playwright 62）由 ci.yml 负责。
#   3. **基础镜像不同**：Cloudland 用 maven:3.8.6-openjdk-8 / openjdk:8-jre-slim /
#      node:16-alpine / nginx:alpine，均已转存到本项目 ACR。
#      要刷新它们需另建一个 refresh workflow（pm-system 那份转存的是 Java 17 那一套，不适用）。
#
# ⚠️ 两条铁律（与 scripts/deploy.sh 的契约）：
#   · 镜像 tag = ${{ github.sha }}，与服务器仓库 HEAD 必须是同一个 commit
#   · GHA 只负责「构建 + 通知服务器」，不直接碰容器 —— 部署逻辑仍在 deploy.sh 里
#
# ⚠️ 代码源必须同步（这是能否切通道的关键前提）：
#   服务器 /root/cloudland 用 `git fetch origin main` 取代码，而 origin 现在指向 Gitee。
#   镜像 tag 来自 GitHub 的 commit SHA —— 两边必须是同一个提交，否则
#   「拉新镜像 + reset 到旧代码」会组合出一个从未被测试过的版本。
#   ⇒ 要么两个远端都推（Gitee 只当代码镜像，流水线已停用），
#     要么把服务器 origin 改成 GitHub（推荐，单一真相来源）。
# ======================================================================

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'Dockerfile'
      - 'vue/src/**'
      - 'vue/public/**'
      - 'vue/package.json'
      - 'vue/package-lock.json'
      - 'vue/vue.config.js'
      - 'vue/babel.config.js'
      - 'vue/Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

env:
  ACR_HOST: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com
  ACR_NAMESPACE: t1longlive

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    # 后端 Java 8 全量编译 + 前端 npm install/build，冷构建实测 15~25 分钟。
    # 30 分钟留了余量，同时避免卡死时空转烧额度。
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 体检：ACR Secrets 是否就位
        # Secret 缺失时 docker/login-action 只报一句含糊的
        # "Username and password required"，看不出缺的是哪个。这里先逐个点名。
        # 用 env 传递而非把 ${{ secrets.X }} 内联进 shell —— 密码里的特殊字符
        # （$ ` ! 等）内联时会被 shell 解析，env 传递不会。
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for pair in "ACR_USERNAME:$ACR_USERNAME" "ACR_PASSWORD:$ACR_PASSWORD"; do
            if [ -z "${pair#*:}" ]; then
              echo "MISSING: ${pair%%:*} —— 去 Settings → Secrets and variables → Actions 添加"
              missing=1
            else
              echo "OK: ${pair%%:*}"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: 登录阿里云 ACR
        # 必须先登录：Dockerfile 的 FROM 用的是本项目 ACR 里的私有基础镜像，
        # 未登录会 pull denied。
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建后端镜像（先不推送）
        # 用 docker CLI 而非 build-push-action：前者复用 daemon 的 ~/.docker/config.json，
        # 私有基础镜像的拉取认证不会丢（buildx 的 docker-container driver 不共享该认证）。
        #
        # 注意：这一步会跑单元测试（Dockerfile 里是 mvn clean package，不带 -DskipTests），
        # 测试红 → 构建失败 → 后面的推送和部署都不会发生。
        run: |
          set -euo pipefail
          docker build \
            -f ./Dockerfile \
            -t cloudland-backend:${{ github.sha }} \
            .

      - name: Trivy 扫描后端镜像（只报告）
        # 为什么这里是 exit-code '0'：
        #   Cloudland 是 Java 8 老栈，基础镜像层的 CVE 无法通过升 Spring Boot 版本消除。
        #   先跑几轮看清基线，能修的修，不能修的写进 .trivyignore（每条带理由和复查条件），
        #   基线收敛后再改 exit-code '1' 转硬门禁 —— 顺序反了只会得到一条天天红的流水线。
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudland-backend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: 推送后端镜像
        run: |
          set -euo pipefail
          docker tag cloudland-backend:${{ github.sha }} $ACR_HOST/$ACR_NAMESPACE/cloudland-backend:${{ github.sha }}
          docker push $ACR_HOST/$ACR_NAMESPACE/cloudland-backend:${{ github.sha }}

      - name: 构建前端镜像（先不推送）
        run: |
          set -euo pipefail
          docker build \
            -f ./vue/Dockerfile \
            -t cloudland-frontend:${{ github.sha }} \
            .

      - name: Trivy 扫描前端镜像（只报告）
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudland-frontend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: 推送前端镜像
        run: |
          set -euo pipefail
          docker tag cloudland-frontend:${{ github.sha }} $ACR_HOST/$ACR_NAMESPACE/cloudland-frontend:${{ github.sha }}
          docker push $ACR_HOST/$ACR_NAMESPACE/cloudland-frontend:${{ github.sha }}

      - name: 输出本次制品
        run: |
          echo "backend  : $ACR_HOST/$ACR_NAMESPACE/cloudland-backend:${{ github.sha }}"
          echo "frontend : $ACR_HOST/$ACR_NAMESPACE/cloudland-frontend:${{ github.sha }}"

  deploy:
    name: 部署到腾讯云服务器
    needs: build
    runs-on: ubuntu-latest
    # 部署只是 SSH + 拉镜像 + 健康检查，正常 2~3 分钟。
    timeout-minutes: 10
    steps:
      - name: 体检：部署用 Secrets 是否就位
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for pair in "SERVER_HOST:$SERVER_HOST" "SERVER_USER:$SERVER_USER" "SSH_PRIVATE_KEY:$SSH_PRIVATE_KEY"; do
            if [ -z "${pair#*:}" ]; then
              echo "MISSING: ${pair%%:*} —— 去 Settings → Secrets and variables → Actions 添加"
              missing=1
            else
              echo "OK: ${pair%%:*}"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: SSH 执行部署脚本
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            # appleboy/ssh-action 的远程 shell 不会设置登录用户的 HOME。
            # 不显式设置的话，git 读不到 /root/.ssh/config 与部署密钥，
            # docker 也读不到 /root/.docker/config.json 里的 ACR 登录凭据。
            export HOME=/root
            cd /root/cloudland
            # 先同步代码再执行脚本 —— 否则 deploy.sh 内部的 git reset --hard
            # 会把「正在执行的自己」覆盖掉，bash 后续读到的行可能与开头不一致。
            git fetch origin main
            git reset --hard origin/main
            # IMAGE_TAG 由 CI 显式指定 —— 服务器不再用 git rev-parse HEAD 去猜，
            # 「跑哪个版本的镜像」与「代码同步到哪」解耦，即使同步慢一步也不会拉错 tag。
            export IMAGE_TAG=${{ github.sha }}
            # CI_COMMIT_SHA 供 deploy.sh 的竞态守卫使用
            # （构建期间又有新 push 时跳过本次部署，交给更新的那次流水线）
            export CI_COMMIT_SHA=${{ github.sha }}
            /bin/bash scripts/deploy.sh main
