version: "1.0"
name: cloudland-deploy
displayName: cloudland-deploy
stages:
- name: 云端构建镜像
  displayName: 云端构建镜像
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  # ⚠️ 镜像 tag = 本次 push 的完整 commit SHA（GITEE_COMMIT），不再是 latest。
  #    依据：Gitee 官方《系统级变量》——GITEE_COMMIT 为完整 commit，
  #    且 build@docker 的「镜像 Tag」字段官方说明支持引用流水线全局变量。
  #    部署侧 scripts/deploy.sh 用 `git rev-parse HEAD` 取同一值，两者必须一致。
  # ⚠️ 不要再用网页可视化编辑器保存本文件：编辑器会删注释、删 dependsOn，
  #    也可能改掉 tag 里的变量。要改就改仓库 YAML 再 push。
  - step: build@docker
    name: build_backend_image
    displayName: 构建后端镜像
    certificate: "18140213287"
    repository: "{{CERTIFICATION.18140213287.server}}"
    username: "{{CERTIFICATION.18140213287.username}}"
    password: "{{CERTIFICATION.18140213287.password}}"
    tag: cloudland-backend:${GITEE_COMMIT}
    dockerfile: ./Dockerfile
    isCache: false
    processorType:
    - amd64
    strategy:
      retry: "0"
  - step: build@docker
    name: build_frontend_image
    displayName: 构建前端镜像
    certificate: "18140213287"
    repository: "{{CERTIFICATION.18140213287.server}}"
    username: "{{CERTIFICATION.18140213287.username}}"
    password: "{{CERTIFICATION.18140213287.password}}"
    tag: cloudland-frontend:${GITEE_COMMIT}
    dockerfile: ./vue/Dockerfile
    isCache: false
    processorType:
    - amd64
    strategy:
      retry: "0"
- name: Deploy To Aliyun
  displayName: Deploy To Aliyun
  # 质量门禁：必须等镜像构建成功才部署。
  # ⚠️ Gitee 可视化编辑器保存时会删掉 dependsOn —— 本项目已发生 1 次，
  #    pm-system 已发生 3 次。每次在网页端保存流水线后，
  #    务必回仓库核对这一行是否还在：
  #      git fetch origin main && git show FETCH_HEAD:.workflow/<文件>.yml | grep -A2 dependsOn
  dependsOn:
  - 云端构建镜像
  strategy: naturally
  trigger: auto
  executor:
  - t1longlive
  steps:
  - step: shell@agent
    name: execute_shell
    displayName: Shell 脚本执行
    schedulerType: DISTRIBUTED
    scriptType: SH
    script: |-
      cd /root/cloudland
      git fetch origin main
      git checkout main
      git reset --hard origin/main

      # 镜像 tag 由 scripts/deploy.sh 计算（= git rev-parse HEAD），
      # 与构建阶段的 ${GITEE_COMMIT} 对应。此处不传 tag，保持单一真相来源。
      /bin/bash scripts/deploy.sh main
    gitClone: "false"
    hostGroupID:
      ID: ali_cloudland
      hostID:
      - 844d9abd-3fd6-4e32-99ee-3339f2497a55
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - main
      precise: []
      include: []
notify: []
