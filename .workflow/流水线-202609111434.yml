version: "1.0"
name: cloudland-deploy
displayName: cloudland-deploy
stages:
- name: 云端构建镜像
  displayName: 云端构建镜像
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  - step: build@docker
    name: build_backend_image
    displayName: 构建后端镜像
    certificate: "18140213287"
    repository: "{{CERTIFICATION.18140213287.server}}"
    username: "{{CERTIFICATION.18140213287.username}}"
    password: "{{CERTIFICATION.18140213287.password}}"
    tag: cloudland-backend:latest
    dockerfile: ./Dockerfile
    isCache: false
    processorType:
    - amd64
    strategy:
      retry: "0"
  - step: build@docker
    name: build_frontend_image
    displayName: 构建前端镜像
    certificate: "18140213287"
    repository: "{{CERTIFICATION.18140213287.server}}"
    username: "{{CERTIFICATION.18140213287.username}}"
    password: "{{CERTIFICATION.18140213287.password}}"
    tag: cloudland-frontend:latest
    dockerfile: ./vue/Dockerfile
    isCache: false
    processorType:
    - amd64
    strategy:
      retry: "0"
- name: Deploy To Aliyun
  displayName: Deploy To Aliyun
  # 质量门禁：必须等镜像构建成功才部署。
  # ⚠️ Gitee 可视化编辑器保存时会删掉 dependsOn —— 本项目已发生 1 次，
  #    pm-system 已发生 3 次。每次在网页端保存流水线后，
  #    务必回仓库核对这一行是否还在：
  #      git fetch origin main && git show FETCH_HEAD:.workflow/<文件>.yml | grep -A2 dependsOn
  dependsOn:
  - 云端构建镜像
  strategy: naturally
  trigger: auto
  executor:
  - t1longlive
  steps:
  - step: shell@agent
    name: execute_shell
    displayName: Shell 脚本执行
    schedulerType: DISTRIBUTED
    scriptType: SH
    script: |-
      cd /root/cloudland
      git fetch origin main
      git checkout main
      git reset --hard origin/main
      /bin/bash scripts/deploy.sh main
    gitClone: "false"
    hostGroupID:
      ID: ali_cloudland
      hostID:
      - 844d9abd-3fd6-4e32-99ee-3339f2497a55
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - main
      precise: []
      include: []
notify: []
