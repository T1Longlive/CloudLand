version: '1.0'
name: cloudland-deploy
displayName: cloudland-deploy
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - main
stages:
  - name: deploy
    displayName: Deploy To Aliyun
    strategy: naturally
    trigger: auto
    executor:
      - t1longlive
    steps:
      - step: shell@agent
        name: execute_shell
        displayName: Shell 脚本执行
        schedulerType: DISTRIBUTED
        hostGroupID:
          ID: ali_cloudland
          hostID:
            - 844d9abd-3fd6-4e32-99ee-3339f2497a55
        scriptType: SH
        script:
            - cd /root/cloudland
            - git fetch origin main
            - git checkout main
            - git reset --hard origin/main
            - |
              if docker compose version >/dev/null 2>&1; then
                DC="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                DC="docker-compose"
              else
                echo "docker compose not found"
                exit 1
              fi
            - $DC pull mysql redis || true
            - $DC build --pull backend frontend
            - $DC up -d --remove-orphans
            - $DC ps
        gitClone: false
        notify: []
        strategy:
          retry: '0'
