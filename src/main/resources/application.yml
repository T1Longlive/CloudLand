server:
  port: 9090
  servlet:
    context-path: /api

access-file:
  resource-handler1: resource/userFile/**
  resource-handler2: resource/landFile/**
  resource-handler3: resource/productFile/**
  location: ${FILE_STORAGE_ROOT:D:/CloudLandFile}

spring:
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cloudland?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:676104035@qq.com}
    password: ${MAIL_PASSWORD:edyqglxcwnysbcci}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    timeout: ${REDIS_TIMEOUT:1800000}
    password: ${REDIS_PASSWORD:123456}
    lettuce:
      pool:
        max-wait: -1
        max-idle: 5
        min-idle: 0
        max-active: 20

jwt:
  signKey: ${JWT_SIGN_KEY:change-me-in-production}
  expire: ${JWT_EXPIRE:604800000}
  week: ${JWT_WEEK:604800000}

# 万能验证码（测试便利功能）：开启后所有验证码校验场景（登录/注册/找回密码）
# 均可使用 master-value 通过。生产环境务必设置 CODE_MASTER_ENABLED=false 关闭！
code:
  master-enabled: ${CODE_MASTER_ENABLED:true}
  master-value: ${CODE_MASTER_VALUE:000000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

alipay:
  appId: ${ALIPAY_APP_ID:your-sandbox-app-id}
  privateKey: ${ALIPAY_PRIVATE_KEY:your-app-private-key}
  publicKey: ${ALIPAY_PUBLIC_KEY:your-alipay-public-key}
  notifyUrl: ${ALIPAY_NOTIFY_URL:http://8.137.114.176/api/alipay/notify}
  returnUrl: ${ALIPAY_RETURN_URL:http://8.137.114.176/user/myOrder}
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
